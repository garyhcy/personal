<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0A0E16">
<title>今晚行下</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0A0E16;
    font-family:"Noto Serif TC",system-ui,-apple-system,"PingFang HK","Microsoft JhengHei",serif;
    color:#EDE6D8;user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  #hud{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none;z-index:5;
    opacity:0;transition:opacity .7s}
  #hud.on{opacity:1}
  #slots{display:flex;gap:9px}
  .slot{width:30px;height:30px;border-radius:50%;
    border:1px solid rgba(237,230,216,.22);background:rgba(10,14,22,.35);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;color:rgba(237,230,216,.28);
    transition:border-color .5s,color .5s,box-shadow .5s,transform .3s}
  .slot.got{border-color:rgba(243,193,120,.85);color:#F3C178;
    box-shadow:0 0 14px rgba(243,193,120,.28);transform:scale(1.04)}
  #cnt{font-size:11px;letter-spacing:.18em;color:rgba(237,230,216,.42)}

  #cap{position:fixed;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom));
    padding:0 26px;text-align:center;z-index:6;pointer-events:none;
    font-size:16px;line-height:1.85;letter-spacing:.03em;
    color:#EFE7D8;text-shadow:0 2px 14px rgba(0,0,0,.85);
    opacity:0;transform:translateY(6px);transition:opacity .45s,transform .45s}
  #cap.on{opacity:1;transform:none}
  #cap.mono{font-size:14px;color:#C9BFAE}

  #clue{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:9;pointer-events:none;opacity:0;transition:opacity .35s}
  #clue.on{opacity:1}
  #clueBox{width:min(78vw,320px);padding:26px 24px 22px;border-radius:4px;
    background:linear-gradient(160deg,rgba(28,33,45,.97),rgba(15,19,28,.97));
    border:1px solid rgba(243,193,120,.32);
    box-shadow:0 18px 60px rgba(0,0,0,.7),inset 0 0 40px rgba(243,193,120,.05);
    text-align:center;transform:scale(.94);transition:transform .35s}
  #clue.on #clueBox{transform:none}
  #clueKick{font-size:10px;letter-spacing:.34em;color:#F3C178;margin-bottom:14px}
  #clueGlyph{font-size:30px;margin-bottom:12px}
  #clueTxt{font-size:14px;line-height:1.9;color:#DDD4C4}

  #toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-6px);
    padding:9px 18px;border-radius:99px;background:rgba(15,19,28,.9);
    border:1px solid rgba(243,193,120,.28);font-size:12.5px;letter-spacing:.08em;
    color:#F3C178;z-index:8;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;white-space:nowrap}
  #toast.on{opacity:1;transform:translateX(-50%)}

  #mute{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:10;
    width:34px;height:34px;border-radius:50%;border:1px solid rgba(237,230,216,.18);
    background:rgba(10,14,22,.5);color:rgba(237,230,216,.7);font-size:13px;
    font-family:system-ui;cursor:pointer}
  #mute.off{color:rgba(237,230,216,.28)}

  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:34px;text-align:center;z-index:20;background:#0A0E16;
    opacity:0;pointer-events:none;transition:opacity .85s}
  .screen.on{opacity:1;pointer-events:auto}
  #intro .kick{font-size:10.5px;letter-spacing:.42em;color:rgba(237,230,216,.5);margin-bottom:26px}
  #intro .lead{font-size:17px;line-height:2.1;letter-spacing:.04em;color:#EDE6D8;max-width:300px;
    white-space:pre-line;min-height:130px;display:flex;align-items:center;justify-content:center}
  .btn{margin-top:34px;padding:13px 34px;border-radius:99px;cursor:pointer;
    border:1px solid rgba(243,193,120,.5);background:rgba(243,193,120,.06);
    color:#F3C178;font-family:inherit;font-size:14px;letter-spacing:.16em;
    transition:background .3s,transform .2s}
  .btn:active{transform:scale(.97);background:rgba(243,193,120,.14)}

  #end{background:radial-gradient(circle at 50% 42%,#1B2130 0%,#0A0E16 62%)}
  #room{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}
  #frames{display:flex;gap:11px;margin-bottom:30px}
  .frame{width:52px;height:66px;border:1px solid rgba(243,193,120,.3);padding:3px;
    opacity:0;transform:translateY(8px) scale(.96);transition:opacity .8s,transform .8s;
    box-shadow:0 6px 22px rgba(0,0,0,.6)}
  .frame.on{opacity:1;transform:none}
  .frame i{display:block;width:100%;height:100%}
  .f-a i{background:linear-gradient(165deg,#3A2A22,#8C4B33 55%,#C9704A)}
  .f-b i{background:linear-gradient(165deg,#232D26,#3E5C4A 60%,#7C9B6E)}
  .f-c i{background:linear-gradient(165deg,#1B2436,#2C4A6E 60%,#6C93BC)}
  .f-d i{background:linear-gradient(165deg,#2A1B22,#6E2F3E 60%,#C0556C)}
  .paper{max-width:320px;opacity:0;transition:opacity .9s}
  .paper.on{opacity:1}
  .paper p{margin:0 0 14px;font-size:14px;line-height:2;color:#B9AE9B}
  .paper .hand{font-size:15.5px;line-height:2.05;color:#E4D9C4;
    font-style:italic;letter-spacing:.02em;white-space:pre-line}
  #endCity{font-size:34px;letter-spacing:.3em;margin:16px 0 4px;opacity:0;
    transition:opacity 1s,letter-spacing 1.4s;color:#F3C178}
  #endCity.on{opacity:1;letter-spacing:.16em}
  #endLine{margin-top:22px;font-size:16px;line-height:2;letter-spacing:.05em;
    white-space:pre-line;opacity:0;transition:opacity 1s}
  #endLine.on{opacity:1}
  #endSmall{margin-top:20px;font-size:11.5px;letter-spacing:.2em;color:rgba(237,230,216,.34);
    opacity:0;transition:opacity .8s}
  #endSmall.on{opacity:1}
  #again{margin-top:26px;opacity:0;transition:opacity .8s;pointer-events:none}
  #again.on{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="slots">
    <div class="slot" id="s0">？</div>
    <div class="slot" id="s1">？</div>
    <div class="slot" id="s2">？</div>
  </div>
  <div id="cnt">停 低 0 次</div>
</div>

<div id="cap"></div>
<div id="toast"></div>
<div id="clue"><div id="clueBox">
  <div id="clueKick">搵 到 一 樣</div>
  <div id="clueGlyph">✉</div>
  <div id="clueTxt"></div>
</div></div>
<button id="mute">♪</button>

<div id="intro" class="screen on">
  <div class="kick" id="ikick">一 把 鎖 匙</div>
  <div class="lead" id="ilead">你喺門口企咗一陣。</div>
  <button class="btn" id="go">開門</button>
</div>

<div id="end" class="screen">
  <div id="room">
    <div id="frames">
      <div class="frame f-a"><i></i></div>
      <div class="frame f-b"><i></i></div>
      <div class="frame f-c"><i></i></div>
      <div class="frame f-d"><i></i></div>
    </div>
    <div class="paper" id="paper">
      <p id="p1"></p>
      <p id="p2" class="hand"></p>
    </div>
    <div id="endCity"></div>
    <div id="endLine"></div>
    <div id="endSmall"></div>
    <button class="btn" id="again">再 行 一 次</button>
  </div>
</div>

<script>
/* ============ 基礎 ============ */
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var VW=0,VH=0,DPR=1,W=1400,H=1000;
var bg=null;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function glow(g,x,y,r,c){var gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,c);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();}

/* ============ 世界資料 ============ */
var ZONES={
  a:{n:'舊街',x:300,y:280,c:'#C4573C',c2:'#8A3A2B',fr:'窗對住河，冬天成條街都係火鍋味。'},
  b:{n:'山上',x:1100,y:280,c:'#5E8C7E',c2:'#3C5A50',fr:'嗰間澡堂，係唯一可以成晚唔講嘢都舒服嘅地方。'},
  c:{n:'河邊',x:300,y:740,c:'#4C6FA5',c2:'#2E4568',fr:'唔係為咗睇燈籠，係為咗等燈籠一盞一盞著。'},
  d:{n:'夜市',x:1100,y:740,c:'#C0556C',c2:'#7E3044',fr:'最後一晚，佢買咗串糖，一路行一路拎住，最後冇食。'}
};
var HOUSE={x:700,y:470};

var SPOTS=[
  {zone:'a',dx:-104,dy:-40,art:'lantern',label:'紅燈籠',line:'啲燈紅得好舊，好似細個屋企樓下嗰間。'},
  {zone:'a',dx:80,dy:30,art:'bowl',label:'麵檔',line:'呢條街落過雨。地下仲反光。'},
  {zone:'a',dx:-8,dy:92,art:'ticket',label:'一地紙',clue:0,line:'一張車票。字都化咗，唔知去邊。'},

  {zone:'b',dx:88,dy:-54,art:'bath',label:'澡堂',line:'行到呢度，耳朵突然靜咗。'},
  {zone:'b',dx:-86,dy:16,art:'lantern',label:'石階燈',line:'有蒸氣。係澡堂。'},
  {zone:'b',dx:34,dy:96,art:'pencil',label:'石級邊',clue:1,line:'一枝鉛筆，寫到剩返一截。'},

  {zone:'c',dx:-94,dy:-72,art:'lantern',label:'水面燈',line:'水面有燈，一路飄。'},
  {zone:'c',dx:96,dy:-46,art:'boat',label:'小船',line:'我想喺度坐一陣。'},
  {zone:'c',dx:-18,dy:-22,art:'photo',label:'濕咗嘅相',clue:2,line:'一張相，撕咗一角。'},

  {zone:'d',dx:-96,dy:-42,art:'stall',label:'麵檔',line:'好多聲。有人叫賣，有人笑。'},
  {zone:'d',dx:86,dy:14,art:'sugar',label:'糖',line:'糖。買咗一枝，唔捨得食。'},
  {zone:'d',dx:-4,dy:92,art:'bowl',label:'檯邊',line:'呢度好似唔會停。'}
];
SPOTS.forEach(function(s,i){
  var z=ZONES[s.zone];
  s.i=i; s.x=z.x+s.dx; s.y=z.y+s.dy;
});

var CLUES=[
  {g:'✉',t:'一張被雨淋到發脹嘅車票。\n目的地嗰行，化開咗。'},
  {g:'✎',t:'一枝用到剩返一截嘅鉛筆。\n筆身有牙印。'},
  {g:'▤',t:'一張撕咗一角嘅相。\n背面寫住「呢度，我住過」。'}
];

/* ============ 背景繪製 ============ */
function roofHouse(g,x,y,w,h,body,roof,warm){
  g.fillStyle=body; g.fillRect(x,y,w,h);
  g.fillStyle=roof;
  g.beginPath();
  g.moveTo(x-9,y); g.lineTo(x+w/2,y-h*0.30); g.lineTo(x+w+9,y); g.closePath(); g.fill();
  g.fillStyle='rgba(0,0,0,.35)'; g.fillRect(x,y+h-6,w,6);
  if(warm){
    for(var i=0;i<Math.max(1,Math.floor(w/46));i++){
      var wx=x+16+i*44, wy=y+16;
      glow(g,wx+7,wy+7,20,'rgba(243,193,120,.20)');
      g.fillStyle='rgba(243,193,120,.62)'; g.fillRect(wx,wy,14,18);
      g.fillStyle=roof; g.fillRect(wx,wy+8,14,1.6);
    }
  }
}

function softShadow(g,x,y,rx,ry,a){
  g.save(); g.translate(x,y); g.scale(1,ry/rx);
  var gr=g.createRadialGradient(0,0,0,0,0,rx);
  gr.addColorStop(0,'rgba(0,0,0,'+a+')');
  gr.addColorStop(0.55,'rgba(0,0,0,'+(a*0.55)+')');
  gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(0,0,rx,0,Math.PI*2); g.fill(); g.restore();
}
function groundPatch(g,z,rx,ry,a,c){
  var gr=g.createRadialGradient(z.x,z.y+16,rx*0.20,z.x,z.y+16,rx);
  gr.addColorStop(0,c.replace('rgb','rgba').length?hexA(c,a):c);
  gr.addColorStop(0.62,hexA(c,a*0.45));
  gr.addColorStop(1,hexA(c,0));
  g.save(); g.translate(z.x,z.y+16); g.scale(1,ry/rx);
  g.fillStyle=gr; g.beginPath(); g.arc(0,0,rx,0,Math.PI*2); g.fill(); g.restore();
}
function hexA(h,a){var n=parseInt(h.slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}

function pine(g,x,y,s,c){
  g.fillStyle=c;
  for(var i=0;i<3;i++){
    var w=s*(1-i*0.22), yy=y-s*0.55*i;
    g.beginPath(); g.moveTo(x,yy-s*0.9); g.lineTo(x-w*0.6,yy); g.lineTo(x+w*0.6,yy); g.closePath(); g.fill();
  }
  g.fillRect(x-1.5,y-2,s*0.1*1.6*2,6);
}

function decoA(g,r){
  var z=ZONES.a,cx=z.x,cy=z.y;
  glow(g,cx,cy+10,250,'rgba(196,87,60,.15)');
  softShadow(g,cx-122,cy-34,86,20,0.34);
  softShadow(g,cx+124,cy-36,92,20,0.34);
  softShadow(g,cx+2,cy-80,80,18,0.34);
  roofHouse(g,cx-168,cy-104,92,66,'#241715','#31201C',true);
  roofHouse(g,cx+72,cy-118,104,78,'#241715','#31201C',true);
  roofHouse(g,cx-40,cy-146,84,62,'#1E1412','#2A1B18',true);
  // 濕地反光
  for(var i=0;i<26;i++){
    var x=cx-190+r()*380, y=cy+40+r()*110;
    g.fillStyle='rgba(243,193,120,'+(0.02+r()*0.05)+')';
    g.fillRect(x,y,10+r()*22,1.4);
  }
  // 電線 + 燈籠
  g.strokeStyle='rgba(0,0,0,.55)'; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(cx-180,cy-96); g.quadraticCurveTo(cx,cy-72,cx+196,cy-88); g.stroke();
  for(var k=0;k<5;k++){
    var t=k/4, lx=cx-180+376*t, ly=cy-96+Math.sin(t*Math.PI)*22;
    g.strokeStyle='rgba(0,0,0,.5)'; g.beginPath(); g.moveTo(lx,ly); g.lineTo(lx,ly+9); g.stroke();
    glow(g,lx,ly+15,26,'rgba(224,96,64,.30)');
    g.fillStyle='#C4573C'; g.beginPath(); g.ellipse(lx,ly+16,6.5,8,0,0,Math.PI*2); g.fill();
    g.fillStyle='rgba(255,220,180,.55)'; g.beginPath(); g.ellipse(lx-2,ly+14,2,3,0,0,Math.PI*2); g.fill();
  }
}

function decoB(g,r){
  var z=ZONES.b,cx=z.x,cy=z.y;
  glow(g,cx,cy+6,240,'rgba(94,140,126,.15)');
  for(var i=0;i<9;i++){
    var x=cx-190+r()*380, y=cy-140+r()*230;
    pine(g,x,y,26+r()*22,'rgba(20,34,30,'+(0.55+r()*0.3)+')');
  }
  // 石階
  g.strokeStyle='rgba(255,255,255,.05)'; g.lineWidth=1;
  for(var s=0;s<7;s++){
    var yy=cy+40+s*13, ww=150-s*10;
    g.beginPath(); g.moveTo(cx-ww/2,yy); g.lineTo(cx+ww/2,yy); g.stroke();
  }
  // 澡堂
  softShadow(g,cx+8,cy+8,92,20,0.36);
  var bx=cx-46,by=cy-72,bw=108,bh=74;
  g.fillStyle='#1C2622'; g.fillRect(bx,by,bw,bh);
  g.fillStyle='#26332D';
  g.beginPath(); g.moveTo(bx-14,by); g.lineTo(bx+bw/2,by-34); g.lineTo(bx+bw+14,by); g.closePath(); g.fill();
  // 暖簾
  for(var n=0;n<4;n++){
    g.fillStyle='rgba(94,140,126,.55)'; g.fillRect(bx+16+n*20,by+18,16,30);
  }
  // 窗
  glow(g,bx+bw-20,by+22,26,'rgba(243,193,120,.22)');
  g.fillStyle='rgba(243,193,120,.55)'; g.fillRect(bx+bw-30,by+14,20,16);
  // 蒸氣
  for(var v=0;v<14;v++){
    var vx=bx+bw+6+r()*40, vy=by+r()*60;
    g.fillStyle='rgba(255,255,255,'+(0.015+r()*0.03)+')';
    g.beginPath(); g.arc(vx,vy,6+r()*10,0,Math.PI*2); g.fill();
  }
}

function decoC(g,r){
  var z=ZONES.c,cx=z.x,cy=z.y;
  // 水
  var wy=cy+40, wh=165;
  var gr=g.createLinearGradient(0,wy,0,wy+wh);
  gr.addColorStop(0,'#16283F'); gr.addColorStop(.5,'#1B3350'); gr.addColorStop(1,'#101E30');
  g.save();
  g.beginPath();
  var rr=26;
  g.moveTo(cx-230+rr,wy); g.lineTo(cx+230-rr,wy);
  g.quadraticCurveTo(cx+230,wy,cx+230,wy+rr);
  g.lineTo(cx+230,wy+wh-rr);
  g.quadraticCurveTo(cx+230,wy+wh,cx+230-rr,wy+wh);
  g.lineTo(cx-230+rr,wy+wh);
  g.quadraticCurveTo(cx-230,wy+wh,cx-230,wy+wh-rr);
  g.lineTo(cx-230,wy+rr);
  g.quadraticCurveTo(cx-230,wy,cx-230+rr,wy);
  g.closePath();
  g.fillStyle=gr; g.fill();
  // 邊緣壓暗
  var eg=g.createLinearGradient(cx-230,0,cx+230,0);
  eg.addColorStop(0,'rgba(10,14,22,.85)'); eg.addColorStop(.18,'rgba(10,14,22,0)');
  eg.addColorStop(.82,'rgba(10,14,22,0)'); eg.addColorStop(1,'rgba(10,14,22,.85)');
  g.fillStyle=eg; g.fill();
  g.restore();
  // 水面光
  for(var i=0;i<60;i++){
    var x=cx-228+r()*456, y=wy+6+r()*wh;
    g.fillStyle='rgba(160,200,240,'+(0.02+r()*0.05)+')';
    g.fillRect(x,y,6+r()*26,1);
  }
  // 堤岸
  g.fillStyle='rgba(24,30,42,.9)'; g.fillRect(cx-230,wy-26,460,26);
  g.fillStyle='rgba(255,255,255,.04)'; g.fillRect(cx-230,wy-26,460,2);
  // 欄杆
  g.fillStyle='rgba(10,14,20,.85)'; g.fillRect(cx-230,wy-30,460,2.4);
  for(var p=0;p<9;p++){
    g.fillStyle='rgba(10,14,20,.75)'; g.fillRect(cx-224+p*54,wy-32,2.2,8);
  }
  // 木樁
  for(var q=0;q<4;q++){
    var px=cx-150+q*96;
    g.fillStyle='rgba(14,19,28,.95)'; g.fillRect(px,wy+6,5,20);
    g.fillStyle='rgba(255,255,255,.05)'; g.fillRect(px,wy+6,5,2);
  }
  // 長凳
  g.fillStyle='rgba(16,21,30,.95)';
  g.fillRect(cx+120,wy-46,64,6);
  g.fillRect(cx+124,wy-40,4,14); g.fillRect(cx+176,wy-40,4,14);
  // 水上燈
  for(var k=0;k<9;k++){
    var lx=cx-196+k*50, ly=wy+26+((k*53)%96);
    glow(g,lx,ly,26,'rgba(243,193,120,.30)');
    g.fillStyle='#F3C178'; g.beginPath(); g.ellipse(lx,ly,5,3.6,0,0,Math.PI*2); g.fill();
    g.fillStyle='rgba(243,193,120,.14)'; g.fillRect(lx-3,ly+3,6,14);
  }
}

function decoD(g,r){
  var z=ZONES.d,cx=z.x,cy=z.y;
  glow(g,cx,cy,270,'rgba(192,85,108,.18)');
  var xs=[cx-176,cx-58,cx+60];
  for(var i=0;i<3;i++){

/* ============ 主迴圈 ============ */
function frame(ms){
  var now=ms/1000;
  var dt=Math.min(0.05, last?now-last:0.016);
  last=now; t=now;
  if(started&&state) update(dt);
  render();
  requestAnimationFrame(frame);
}

function update(dt){
  if(state.ended) return;
  var p=state.p, tgt=state.tgt;
  if(tgt){
    var dx=tgt.x-p.x, dy=tgt.y-p.y, d=Math.hypot(dx,dy);
    if(d>1.6){
      var sp=212*dt;
      var nx=dx/d, ny=dy/d;
      p.x+=nx*sp; p.y+=ny*sp;
      state.moving=true;
      state.walk+=sp;
      if(Math.abs(nx)>0.15) state.face=nx>0?1:-1;
    }else{
      p.x=tgt.x; p.y=tgt.y; state.moving=false; state.tgt=null;
      if(pending>=0){ var idx=pending; pending=-1; collect(idx); }
      else if(pending===-2){ pending=-1; if(nearHouse()) openDoor(); }
    }
  }else{
    state.moving=false;
  }
  // 唔好行落水
  if(p.y>ZONES.c.y+42&&p.x>70&&p.x<530) p.y=ZONES.c.y+40;
  // 區域首次踏足
  for(var k in ZONES){
    var z=ZONES[k];
    if(!state.seenZone[k]&&Math.hypot(p.x-z.x,p.y-z.y)<185){
      state.seenZone[k]=1;
      setTimeout(function(z){ say(z.fr,'mono'); }.bind(null,z), 700);
    }
  }
  // 三樣齊
  if(Object.keys(state.clues).length>=3&&!state.toastDone){
    state.toastDone=true;
    setTimeout(function(){ toast('三 樣 嘢 都 齊 了 。 返 屋 企 。'); say('走廊盡頭嗰道門，開得。','mono'); },900);
  }
  // 相機
  cam.x+=(p.x-cam.x)*Math.min(1,dt*4.2);
  cam.y+=(p.y-cam.y)*Math.min(1,dt*4.2);
  clampCam();
}

function nearHouse(){ return Math.hypot(state.p.x-HOUSE.x,state.p.y-HOUSE.y)<58; }

function clampCam(){
  var hw=VW/(2*cam.scale), hh=VH/(2*cam.scale);
  if(W<=hw*2) cam.x=W/2; else cam.x=clamp(cam.x,hw,W-hw);
  if(H<=hh*2) cam.y=H/2; else cam.y=clamp(cam.y,hh,H-hh);
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0A0E16'; ctx.fillRect(0,0,VW,VH);
  ctx.save();
  ctx.translate(VW/2,VH/2); ctx.scale(cam.scale,cam.scale); ctx.translate(-cam.x,-cam.y);
  if(bg) ctx.drawImage(bg,0,0,W,H);
  drawWaterShimmer();
  drawSpots();
  drawHouseGlow();
  if(state) drawPlayer();
  drawFlies();
  ctx.restore();
  vignette();
}

var sayTimer=null, hideTimer=null, toastTimer=null, clueTimer=null;

function say(txt, cls){
  var el=document.getElementById('cap');
  if(sayTimer) clearInterval(sayTimer);
  if(hideTimer) clearTimeout(hideTimer);
  el.className=(cls==='mono'?'mono':'')+' on';
  el.textContent='';
  var i=0;
  sayTimer=setInterval(function(){
    i++;
    el.textContent=txt.slice(0,i);
    if(i>=txt.length){
      clearInterval(sayTimer); sayTimer=null;
      hideTimer=setTimeout(function(){ el.classList.remove('on'); }, 1600+txt.length*26);
    }
  },26);
}

function toast(txt){
  var el=document.getElementById('toast');
  el.textContent=txt;
  el.classList.add('on');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.classList.remove('on'); },2600);
}

function showClue(c){
  var box=document.getElementById('clue');
  document.getElementById('clueGlyph').textContent=c.g;
  document.getElementById('clueTxt').textContent=c.t;
  box.classList.add('on');
  if(clueTimer) clearTimeout(clueTimer);
  clueTimer=setTimeout(function(){ box.classList.remove('on'); },2700);
}

function updateHUD(){
  for(var i=0;i<3;i++){
    var el=document.getElementById('s'+i);
    if(state.clues[i]){ el.textContent=CLUES[i].g; el.classList.add('got'); }
    else{ el.textContent='？'; el.classList.remove('got'); }
  }
  document.getElementById('cnt').textContent='停 低 '+state.stopped+' 次';
}

/* ============ 音效 ============ */
var ac=null;
function blip(freq,dur,vol){
  if(!soundOn) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.value=vol;
    o.connect(g); g.connect(ac.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dur);
    o.stop(ac.currentTime+dur);
  }catch(e){}
}

/* ============ 互動 ============ */
function collect(i){
  var s=SPOTS[i];
  if(state.done[s.i]) return;
  state.done[s.i]=1;
  state.counts[s.zone]=(state.counts[s.zone]||0)+1;
  state.stopped++;
  if(order.indexOf(s.zone)<0) order.push(s.zone);
  if(s.clue!==undefined){
    state.clues[s.clue]=1;
    blip(660,0.16,0.14); setTimeout(function(){ blip(990,0.22,0.10); },90);
    showClue(CLUES[s.clue]);
  }else{
    blip(520,0.12,0.09);
  }
  updateHUD();
  say(s.line);
}

function handleTap(w){
  // 屋企
  if(Math.hypot(w.x-HOUSE.x,w.y-HOUSE.y)<66){
    if(Object.keys(state.clues).length>=3){
      state.tgt={x:HOUSE.x,y:HOUSE.y+40}; pending=-2;
    }else{
      blip(200,0.12,0.08);
      toast('門仲鎖住。仲有三樣嘢未搵到。');
    }
    return;
  }
  // 最近嘅物件
  var best=-1,bd=1e9;
  for(var i=0;i<SPOTS.length;i++){
    var s=SPOTS[i];
    if(state.done[s.i]) continue;
    var d=Math.hypot(w.x-s.x,w.y-s.y);
    if(d<bd){ bd=d; best=i; }
  }
  if(best>=0&&bd<84){
    var sp=SPOTS[best];
    var ang=Math.atan2(state.p.y-sp.y,state.p.x-sp.x);
    state.tgt={x:sp.x+Math.cos(ang)*54,y:sp.y+Math.sin(ang)*54};
    pending=best;
    return;
  }
  var tx=clamp(w.x,40,W-40), ty=clamp(w.y,40,H-40);
  if(ty>ZONES.c.y+42&&tx>70&&tx<530) ty=ZONES.c.y+40;
  state.tgt={x:tx,y:ty};
  pending=-1;
}

cv.addEventListener('pointerdown',function(e){
  if(!started||state.ended) return;
  var r=cv.getBoundingClientRect();
  handleTap(s2w(e.clientX-r.left,e.clientY-r.top));
});

/* ============ 結局 ============ */
function pickCity(){
  var best=null,bs=-1;
  var keys=['a','b','c','d'];
  for(var i=0;i<keys.length;i++){
    var k=keys[i], sc=state.counts[k]||0;
    if(sc>bs){ bs=sc; best=k; }
    else if(sc===bs&&bs>0){
      var oa=order.indexOf(k), ob=order.indexOf(best);
      if(oa<ob) best=k;
    }
  }
  return {name:ZONES[best].n,key:best};
}

function herWords(){
  var out=[];
  for(var i=0;i<SPOTS.length;i++){
    var s=SPOTS[i];
    if(s.clue!==undefined&&state.done[s.i]) out.push('「'+s.line+'」');
  }
  return out.join('\n');
}

function openDoor(){
  if(state.ended) return;
  state.ended=true;
  blip(160,0.55,0.10);
  document.getElementById('hud').classList.remove('on');
  document.getElementById('cap').classList.remove('on');
  var city=pickCity();
  var end=document.getElementById('end');
  var paper=document.getElementById('paper');
  var p1=document.getElementById('p1'), p2=document.getElementById('p2');
  var ec=document.getElementById('endCity');
  var el2=document.getElementById('endLine');
  var es=document.getElementById('endSmall');
  var again=document.getElementById('again');
  var fr=document.querySelectorAll('.frame');

  setTimeout(function(){ end.classList.add('on'); },420);
  for(var i=0;i<fr.length;i++){
    (function(n){ setTimeout(function(){ fr[n].classList.add('on'); },1150+n*280); })(i);
  }
  setTimeout(function(){
    p1.textContent='你返到屋企。桌上多咗一張紙。\n\n紙上面係佢嘅字：\n「呢四張相，係我住過嘅地方。\n你揀嘅嗰個，幫我去睇一次。」';
    paper.classList.add('on');
  },2600);
  setTimeout(function(){ p2.textContent='你今晚講過：\n'+herWords(); },4400);
  setTimeout(function(){ ec.textContent=city.name; ec.classList.add('on'); },6500);
  setTimeout(function(){
    el2.textContent='唔使住。\n我哋 12 月，去'+city.name+'。\n三晚，我帶你行。';
    el2.classList.add('on');
  },7900);
  setTimeout(function(){
    es.textContent='你今晚停低咗 '+state.stopped+' 次';
    es.classList.add('on'); again.classList.add('on');
  },9200);
}

/* ============ 開場 ============ */
var INTRO=[
  {k:'一 把 鎖 匙',l:'你喺門口企咗一陣。',b:'開門'},
  {k:'一 個 地 址',l:'鎖匙係佢寄嚟嘅。\n信封上面冇寫名，只有一個地址。',b:'入去'},
  {k:'冇 人 喺 屋 企',l:'屋入面好空。\n窗邊有四張相，相入面嘅地方，你都冇去過。\n走廊盡頭，仲有一道鎖住嘅門。',b:'出去行下'}
];
var introStep=0;

document.getElementById('go').addEventListener('click',function(){
  blip(420,0.1,0.06);
  introStep++;
  if(introStep<INTRO.length){
    document.getElementById('ikick').textContent=INTRO[introStep].k;
    document.getElementById('ilead').textContent=INTRO[introStep].l;
    document.getElementById('go').textContent=INTRO[introStep].b;
  }else{
    startGame();
  }
});

function startGame(){
  document.getElementById('intro').classList.remove('on');
  state=newState();
  order=[];
  started=true;
  cam.x=state.p.x; cam.y=state.p.y-40;
  updateHUD();
  setTimeout(function(){ document.getElementById('hud').classList.add('on'); },600);
  setTimeout(function(){ say('點邊度，就行過去。','mono'); },1200);
  setTimeout(function(){ say('走廊盡頭嗰道門，鎖住。','mono'); },6400);
}

document.getElementById('again').addEventListener('click',function(){
  document.getElementById('end').classList.remove('on');
  var fr=document.querySelectorAll('.frame');
  for(var i=0;i<fr.length;i++) fr[i].classList.remove('on');
  document.getElementById('paper').classList.remove('on');
  document.getElementById('p1').textContent='';
  document.getElementById('p2').textContent='';
  var ec=document.getElementById('endCity'); ec.classList.remove('on'); ec.textContent='';
  var el2=document.getElementById('endLine'); el2.classList.remove('on'); el2.textContent='';
  var es=document.getElementById('endSmall'); es.classList.remove('on'); es.textContent='';
  document.getElementById('again').classList.remove('on');
  state=newState(); order=[];
  cam.x=state.p.x; cam.y=state.p.y-40;
  updateHUD();
  document.getElementById('hud').classList.add('on');
  say('再行一次。','mono');
});

document.getElementById('mute').addEventListener('click',function(){
  soundOn=!soundOn;
  this.classList.toggle('off',!soundOn);
  this.textContent=soundOn?'♪':'♪̸';
});

/* ============ 啟動 ============ */
resize();
buildBG();
initFlies();
state=newState();
updateHUD();
requestAnimationFrame(frame);

window.__g={
  state:function(){ return state; },
  teleport:function(x,y){ state.p.x=x; state.p.y=y; state.tgt=null; pending=-1; cam.x=x; cam.y=y; },
  tap:function(w){ handleTap(w); },
  tapSpot:function(i){ var s=SPOTS[i]; handleTap({x:s.x,y:s.y}); },
  cam:function(){ return {x:cam.x,y:cam.y,scale:cam.scale,vw:VW,vh:VH}; },
  spots:function(){ return SPOTS; },
  house:HOUSE,
  clues:function(){ return Object.keys(state.clues); },
  intro:function(){ return introStep; }
};
</script>
