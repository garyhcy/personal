<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>夾走一個城市 · Gary & 琪琪</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0A0C12;color:#F3EDE3;overflow:hidden;
    font-family:"PingFang TC","Noto Sans TC",system-ui,-apple-system,sans-serif;
    touch-action:none;overscroll-behavior:none}
  #wrap{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
  canvas{display:block;max-width:100%;max-height:100%;touch-action:none}

  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:center;padding:14px 16px;font-size:12px;letter-spacing:.18em;color:#8B8578;
    pointer-events:none;z-index:5}
  #hud .right{pointer-events:auto;display:flex;gap:14px;align-items:center}
  #hud button{background:none;border:1px solid #262B36;color:#8B8578;font-size:11px;
    padding:5px 10px;border-radius:8px;font-family:inherit;cursor:pointer}

  #intro{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:32px;
    background:radial-gradient(circle at 50% 35%,#141B2E 0%,#0A0C12 70%);transition:opacity .45s}
  #intro.off{opacity:0;pointer-events:none}
  #intro .k{font-size:11px;letter-spacing:.32em;color:#6E6A5E;margin-bottom:20px}
  #intro h1{font-size:31px;line-height:1.35;margin-bottom:12px;font-weight:700}
  #intro h1 span{color:#E0A458}
  #intro .sub{font-size:13.5px;color:#8B8578;line-height:1.9;margin-bottom:30px}
  #intro .cta{padding:14px 40px;border:none;border-radius:99px;background:#E0A458;color:#0B0D14;
    font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
  #intro .cta:active{transform:scale(.96)}

  #end{position:absolute;inset:0;z-index:12;background:#0A0C12;overflow-y:auto;
    padding:40px 24px 30px;opacity:0;pointer-events:none;transition:opacity .5s}
  #end.on{opacity:1;pointer-events:auto}
  #end .kick{font-size:11px;letter-spacing:.3em;color:#6E6A5E;text-align:center;margin-bottom:16px}
  #end .city{font-size:50px;font-weight:700;text-align:center;line-height:1.2;margin-bottom:8px;
    animation:up .55s both}
  #end .theme{font-size:14.5px;color:#C4BCAE;text-align:center;margin-bottom:24px;animation:up .55s .07s both}
  #end .loot{display:flex;justify-content:center;gap:14px;margin-bottom:24px;animation:up .55s .14s both}
  #end .loot span{font-size:38px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
  #end .lootname{text-align:center;font-size:13px;color:#8B8578;margin:-12px 0 22px;animation:up .55s .17s both}
  #end .reason{border-left:2px solid #E0A458;background:rgba(224,164,88,.06);padding:16px 18px;
    font-size:14.5px;line-height:1.95;color:#E2DCD1;white-space:pre-line;margin-bottom:26px;
    animation:up .55s .2s both}
  #end .acts{display:flex;gap:12px;animation:up .55s .26s both;padding-bottom:20px}
  #end .acts button{flex:1;padding:14px;border-radius:12px;font-family:inherit;font-size:15px;
    font-weight:600;cursor:pointer;border:1px solid #262B36;background:transparent;color:#F3EDE3}
  #end .acts button.p{background:#E0A458;color:#0B0D14;border-color:#E0A458}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="hudLeft">夾走一個城市</div>
    <div class="right"><button id="mute">聲音</button></div>
  </div>

  <div id="intro">
    <div class="k">GARY &nbsp;💕&nbsp; 琪琪</div>
    <h1>夾走<br><span>一個城市</span></h1>
    <div class="sub">爪會左右行。點一下螢幕放爪。<br>你夾到嘅嘢，就係你想要嘅旅行。<br>四次機會。</div>
    <button class="cta" id="go">開始</button>
  </div>

  <div id="end"></div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 相機／畫布 ---------- */
  var W=360, H=620;
  var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
  var view={scale:1, offX:0, offY:0, dpr:1};

  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1, 2);
    var availW=window.innerWidth, availH=window.innerHeight;
    var s=Math.min(availW/W, availH/H);
    cv.style.width=(W*s)+"px"; cv.style.height=(H*s)+"px";
    cv.width=Math.round(W*s*dpr); cv.height=Math.round(H*s*dpr);
    ctx.setTransform(s*dpr,0,0,s*dpr,0,0);
    view.scale=s; view.dpr=dpr;
  }
  window.addEventListener("resize",resize);

  /* ---------- 調音數值 ---------- */
  var CFG={
    railY:104, restY:126, bottomY:452,
    clawSpeed:520,          // px/s 下降
    swingPeriod:2.6,        // 秒一個來回
    swingPad:46,
    grabRadX:34,            // 夾中判定（對玩家寬鬆）
    chuteX:52,
    trayY:506,
    drops:4,
    itemR:25,
    carrySpeed:460,
    liftSpeed:430
  };

  /* ---------- 獎品（城市元素） ---------- */
  var PRIZES=[
    {e:"🥟",n:"小籠包",w:"sh"},{e:"🌃",n:"外灘夜景",w:"sh"},{e:"☕",n:"梧桐樹咖啡",w:"sh"},
    {e:"🧋",n:"珍珠奶茶",w:"tw"},{e:"🍜",n:"牛肉麵",w:"tw"},{e:"♨️",n:"北投溫泉",w:"tw"},
    {e:"🍣",n:"壽司",w:"jp"},{e:"⛩️",n:"鳥居",w:"jp"},{e:"🗻",n:"富士山",w:"jp"},
    {e:"🏯",n:"故宮",w:"bj"},{e:"🧸",n:"LABUBU",w:"bj"},{e:"🍡",n:"糖葫蘆",w:"bj"}
  ];

  var CITY={
    sh:{n:"上海",t:"梧桐樹與外灘的都會浪漫",c:"#D9A24D",
      r:"你想要一個可以慢慢行、慢慢食、\n入夜之後仍然有燈嘅城市。"},
    tw:{n:"台灣",t:"夜市煙火氣＋溫泉",c:"#E2654E",
      r:"你想要唔使計劃，拖住手行入去就有嘢食，\n攰就浸一浸。\n呢個城市唔需要行程表。"},
    jp:{n:"日本",t:"關西紅葉尾＋燈飾＋和牛",c:"#6E9BD8",
      r:"你想要儀式感，\n想要一個連等車、連行路都值得記住嘅地方。"},
    bj:{n:"北京",t:"皇城冬日＋潮玩 IP 朝聖",c:"#C8435C",
      r:"你想要一個可以一齊癲、\n一齊笑到收唔到聲嘅城市。"}
  };

  /* ---------- 音效 ---------- */
  var AC=null, muted=false;
  function unlockAudio(){
    if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
    if(AC && AC.state==="suspended"){ AC.resume(); }
  }
  function blip(freq,dur,type,vol){
    if(!AC||muted) return;
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    g.gain.value=vol||0.08;
    o.connect(g); g.connect(AC.destination);
    var t=AC.currentTime;
    g.gain.setValueAtTime(g.gain.value,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.12));
    o.start(t); o.stop(t+(dur||0.12)+0.02);
  }
  function sfxDrop(){ blip(320,.09,"triangle",.05); }
  function sfxGrab(){ blip(660,.08,"square",.06); setTimeout(function(){blip(880,.1,"square",.06);},70); }
  function sfxMiss(){ blip(150,.16,"sawtooth",.05); }
  function sfxWin(){ blip(523,.1,"sine",.07); setTimeout(function(){blip(659,.1);},90); setTimeout(function(){blip(784,.18);},180); }

  /* ---------- 遊戲狀態 ---------- */
  var items=[], caught=[], dropsLeft=CFG.drops, score={sh:0,tw:0,jp:0,bj:0};
  var phase="idle";          // idle | drop | grab | lift | carry | release | done
  var claw={x:W/2, y:CFG.restY, holding:null};
  var swingT=0, shake=0, hintFade=1, started=false, guideShown=false;
  var T=0;

  function rnd(a,b){ return a+Math.random()*(b-a); }

  function newItem(p){
    return {e:p.e,n:p.n,w:p.w,x:rnd(78,302),y:rnd(196,436),
      r:CFG.itemR, tilt:rnd(-.3,.3), bob:rnd(0,6.28), dead:false};
  }

  function reset(){
    items=[]; caught=[]; dropsLeft=CFG.drops; score={sh:0,tw:0,jp:0,bj:0};
    phase="idle"; claw={x:W/2,y:CFG.restY,holding:null}; swingT=0; T=0;
    started=false; guideShown=false; hintFade=1;
    // 抽 9 件（每城至少 2 件，唔會完全偏心）
    var pool=PRIZES.slice();
    var picked=[], byCity={sh:[],tw:[],jp:[],bj:[]};
    pool.forEach(function(p){ byCity[p.w].push(p); });
    Object.keys(byCity).forEach(function(c){
      byCity[c].sort(function(){return Math.random()-.5;});
      picked.push(byCity[c][0]); picked.push(byCity[c][1]);
    });
    picked.sort(function(){return Math.random()-.5;});
    picked.slice(0,8).forEach(function(p){
      var it=null, tries=0;
      while(tries<220){
        var cand=newItem(p);
        var ok=true;
        for(var i=0;i<items.length;i++){
          var d=Math.hypot(items[i].x-cand.x, items[i].y-cand.y);
          if(d < CFG.itemR*2+10){ ok=false; break; }
        }
        if(ok){ it=cand; break; }
        tries++;
      }
      items.push(it || newItem(p));
    });
  }

  /* ---------- 輸入 ---------- */
  function tap(){
    unlockAudio();
    if(!started){ started=true; }
    if(phase!=="idle" || dropsLeft<=0) return;
    phase="drop"; dropsLeft--;
    guideShown=true;
    sfxDrop();
  }
  cv.addEventListener("pointerdown",function(ev){ ev.preventDefault(); tap(); });
  document.addEventListener("keydown",function(ev){
    if(ev.code==="Space"||ev.code==="Enter"){ ev.preventDefault(); tap(); }
  });

  /* ---------- 更新 ---------- */
  function update(dt){
    T+=dt;
    if(shake>0) shake=Math.max(0,shake-dt*4);
    if(started) hintFade=Math.max(0,hintFade-dt*1.2);

    if(phase==="idle"){
      swingT+=dt;
      var k=(Math.sin(swingT/CFG.swingPeriod*Math.PI*2)+1)/2;
      claw.x=CFG.swingPad+(W-CFG.swingPad*2)*k;
      claw.y=CFG.restY+Math.sin(T*2.2)*2;
    }
    else if(phase==="drop"){
      claw.y+=CFG.clawSpeed*dt;
      // 碰撞：最上層而又喺 x 範圍內
      var hit=null;
      for(var i=0;i<items.length;i++){
        var it=items[i];
        if(it.dead) continue;
        if(Math.abs(it.x-claw.x)<CFG.grabRadX && claw.y>=it.y-it.r*0.8){
          if(!hit || it.y<hit.y) hit=it;
        }
      }
      if(hit){ hit.dead=true; claw.holding=hit; phase="lift"; sfxGrab(); shake=0.5;
        if(navigator.vibrate) navigator.vibrate(18); return; }
      if(claw.y>=CFG.bottomY){ phase="lift"; sfxMiss(); shake=0.3;
        if(navigator.vibrate) navigator.vibrate([8,40,8]); }
    }
    else if(phase==="lift"){
      claw.y-=CFG.liftSpeed*dt;
      if(claw.y<=CFG.restY){ claw.y=CFG.restY;
        if(claw.holding){ phase="carry"; } else { phase="idle"; if(dropsLeft<=0) endGame(); }
      }
    }
    else if(phase==="carry"){
      var tx=CFG.chuteX;
      if(Math.abs(claw.x-tx)<6){ claw.x=tx; phase="release"; }
      else {
        var d=Math.sign(tx-claw.x);
        claw.x+=d*CFG.carrySpeed*dt;
        if(Math.sign(tx-claw.x)!==d) claw.x=tx;
      }
      if(claw.holding){ claw.holding.x=claw.x; claw.holding.y=claw.y+26; }
    }
    else if(phase==="release"){
      var it2=claw.holding;
      claw.holding=null;
      if(it2){
        caught.push(it2);
        score[it2.w]=(score[it2.w]||0)+1;
        sfxWin();
        if(navigator.vibrate) navigator.vibrate(12);
      }
      claw.x=W/2; claw.y=CFG.restY;
      if(dropsLeft<=0){ endGame(); } else { phase="idle"; }
    }
  }

  /* ---------- 繪圖 ---------- */
  function roundRect(c,x,y,w,h,r){
    c.beginPath();
    c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
  }

  function drawEmoji(c,e,x,y,size){
    c.font=size+"px system-ui, 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    c.textAlign="center"; c.textBaseline="middle";
    c.fillText(e,x,y);
  }

  function draw(){
    ctx.save();
    var sx=0, sy=0;
    if(shake>0){ sx=rnd(-1,1)*shake*4; sy=rnd(-1,1)*shake*4; }
    ctx.clearRect(0,0,W,H);

    /* 背景 */
    var bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,"#111726"); bg.addColorStop(.55,"#0E1320"); bg.addColorStop(1,"#0A0C12");
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    ctx.translate(sx,sy);

    /* 機箱 */
    var bx=18, by=84, bw=W-36, bh=380;
    ctx.save();
    roundRect(ctx,bx,by,bw,bh,18);
    var glass=ctx.createLinearGradient(bx,by,bx,by+bh);
    glass.addColorStop(0,"rgba(40,58,92,.55)");
    glass.addColorStop(.5,"rgba(24,34,56,.45)");
    glass.addColorStop(1,"rgba(14,20,34,.65)");
    ctx.fillStyle=glass; ctx.fill();
    ctx.clip();

    /* 玻璃反光 */
    ctx.globalAlpha=.06; ctx.fillStyle="#FFFFFF";
    ctx.beginPath(); ctx.moveTo(bx,by+bh); ctx.lineTo(bx+150,by); ctx.lineTo(bx+215,by); ctx.lineTo(bx+65,by+bh); ctx.fill();
    ctx.globalAlpha=1;

    /* 獎品 */
    items.forEach(function(it){
      if(it.dead) return;
      var bobY=Math.sin(T*1.6+it.bob)*2;
      ctx.save();
      ctx.translate(it.x,it.y+bobY);
      ctx.rotate(it.tilt);
      ctx.beginPath(); ctx.arc(0,0,it.r,0,6.284);
      var g=ctx.createRadialGradient(-6,-8,2,0,0,it.r);
      g.addColorStop(0,"rgba(255,255,255,.16)"); g.addColorStop(1,"rgba(255,255,255,.03)");
      ctx.fillStyle=g; ctx.fill();
      ctx.strokeStyle="rgba(255,255,255,.10)"; ctx.lineWidth=1; ctx.stroke();
      drawEmoji(ctx,it.e,0,1,30);
      ctx.restore();
    });

    /* 底槽線 */
    ctx.globalAlpha=.12; ctx.strokeStyle="#8FA6C8"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(bx+10,CFG.bottomY+14); ctx.lineTo(bx+bw-10,CFG.bottomY+14); ctx.stroke();
    ctx.globalAlpha=1;

    /* 瞄準線：落爪會經過嘅直線 */
    if(dropsLeft>0 && phase!=="done"){
      ctx.save();
      ctx.setLineDash([3,7]);
      ctx.strokeStyle="rgba(224,164,88,.22)";
      ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(claw.x,claw.y+10); ctx.lineTo(claw.x,CFG.bottomY+8); ctx.stroke();
      ctx.restore();
    }

    /* 爪 */
    var cx=claw.x, cy=claw.y;
    ctx.strokeStyle="#B9C4D6"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx,by-6); ctx.lineTo(cx,cy); ctx.stroke();

    /* 爪頭 */
    ctx.save();
    ctx.translate(cx,cy);
    ctx.fillStyle="#D8E0EE";
    roundRect(ctx,-12,-6,24,12,5); ctx.fill();
    var open=(phase==="drop")?1:0;
    var ang=phase==="drop"?0.55:0.3;
    [-1,1].forEach(function(sgn){
      ctx.save();
      ctx.translate(sgn*9,4);
      ctx.rotate(sgn*(phase==="drop"?0.2:0.32));
      ctx.strokeStyle="#D8E0EE"; ctx.lineWidth=3.2; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.quadraticCurveTo(sgn*5,12,sgn*2,20); ctx.stroke();
      ctx.restore();
    });
    ctx.restore();

    /* 爪上嘅獎品 */
    if(claw.holding){
      drawEmoji(ctx,claw.holding.e,cx,cy+30,30);
    }

    ctx.restore(); // 機箱 clip

    /* 機箱邊框 */
    roundRect(ctx,bx,by,bw,bh,18);
    ctx.strokeStyle="rgba(160,180,215,.22)"; ctx.lineWidth=1.4; ctx.stroke();

    /* 頂路軌 */
    ctx.strokeStyle="rgba(160,180,215,.18)"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(bx+16,CFG.railY-6); ctx.lineTo(bx+bw-16,CFG.railY-6); ctx.stroke();

    /* 出貨口 */
    ctx.save();
    roundRect(ctx,26,CFG.trayY-16,64,54,10);
    ctx.fillStyle="rgba(255,255,255,.05)"; ctx.fill();
    ctx.strokeStyle="rgba(160,180,215,.22)"; ctx.lineWidth=1.2; ctx.stroke();
    ctx.restore();

    /* 托盤（夾到嘅嘢） */
    for(var i=0;i<CFG.drops;i++){
      var sx2=bx+bw-30-i*42;
      ctx.save();
      ctx.globalAlpha = i<caught.length?1:.18;
      if(i<caught.length){ drawEmoji(ctx,caught[caught.length-1-i].e,sx2,CFG.trayY+10,26); }
      else { ctx.strokeStyle="#3A4356"; ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(sx2,CFG.trayY+10,12,0,6.284); ctx.stroke(); }
      ctx.restore();
    }

    /* 剩餘次數 */
    ctx.fillStyle="rgba(243,237,227,.85)";
    ctx.font="600 12px system-ui,-apple-system,sans-serif";
    ctx.textAlign="left"; ctx.textBaseline="alphabetic";
    ctx.fillText("剩 "+dropsLeft+" 次",bx+2,H-26);

    /* 第一次提示 */
    if(!started && phase==="idle" && hintFade>0){
      ctx.save();
      ctx.globalAlpha=hintFade*(0.55+0.35*Math.sin(T*4));
      ctx.fillStyle="#E0A458";
      ctx.beginPath();
      ctx.moveTo(claw.x,claw.y-26); ctx.lineTo(claw.x-9,claw.y-40); ctx.lineTo(claw.x+9,claw.y-40);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    if(!started){
      ctx.save();
      ctx.globalAlpha=.9;
      ctx.fillStyle="#8B8578"; ctx.font="13px system-ui,-apple-system,sans-serif";
      ctx.textAlign="center";
      ctx.fillText("點一下螢幕，放爪",W/2,H-56);
      ctx.restore();
    }

    ctx.restore();
  }

  /* ---------- 結局 ---------- */
  function endGame(){
    phase="done";
    var endEl0=document.getElementById("end");
    if(caught.length===0){
      endEl0.innerHTML=
        '<div class="kick">四次都扑空</div>'+
        '<div class="city" style="color:#8B8578">再嚟過</div>'+
        '<div class="theme">爪要停喺獎品正上方先落到手</div>'+
        '<div class="reason">'+"冇夾到，就冇得揀城市。\n再試一次，瞄準啲。\n（提示：爪行到獎品頭頂先好放）"+'</div>'+
        '<div class="acts"><button id="again">再夾一次</button></div>';
      endEl0.classList.add("on");
      document.getElementById("again").onclick=function(){
        endEl0.classList.remove("on"); reset();
      };
      return;
    }
    // 同票時：用最早夾到嘅一件所屬城市（第一直覺）
    var order=Object.keys(score).slice().sort(function(a,b){
      if(score[b]!==score[a]) return score[b]-score[a];
      var ai=-1, bi=-1;
      for(var i=0;i<caught.length;i++){
        if(ai<0 && caught[i].w===a) ai=i;
        if(bi<0 && caught[i].w===b) bi=i;
      }
      return (ai<0?99:ai)-(bi<0?99:bi);
    });
    var best=CITY[order[0]];
    var endEl=document.getElementById("end");
    var loot=caught.map(function(c){ return '<span>'+c.e+'</span>'; }).join("");
    var names=caught.map(function(c){ return c.n; }).join("、");

    endEl.innerHTML=
      '<div class="kick">你夾走咗 '+caught.length+' 件</div>'+
      '<div class="city" style="color:'+best.c+'">'+best.n+'</div>'+
      '<div class="theme">'+best.t+'</div>'+
      '<div class="loot">'+loot+'</div>'+
      '<div class="lootname">你夾到：'+names+'</div>'+
      '<div class="reason">'+best.r+'</div>'+
      '<div class="acts"><button id="again">再夾一次</button><button class="p" id="share">分享結果</button></div>';
    endEl.classList.add("on");

    document.getElementById("again").onclick=function(){
      endEl.classList.remove("on");
      reset();
    };
    var shareBtn=document.getElementById("share");
    function copied(){
      shareBtn.textContent="已複製 ✓";
      setTimeout(function(){ shareBtn.textContent="分享結果"; },1600);
    }
    shareBtn.onclick=function(){
      var txt="我夾走咗一個城市 🎪\nGary 💕 琪琪\n我夾到："+names+"\n結果："+best.n+" — "+best.t;
      if(navigator.share){
        navigator.share({title:"夾走一個城市",text:txt}).catch(function(){
          if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(copied).catch(function(){}); }
        });
      } else if(navigator.clipboard){
        navigator.clipboard.writeText(txt).then(copied).catch(function(){});
      }
    };
  }

  /* ---------- 主迴圈 ---------- */
  var last=0;
  function loop(ts){
    if(!last) last=ts;
    var dt=Math.min((ts-last)/1000, 0.05);
    last=ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  document.getElementById("go").onclick=function(){
    unlockAudio();
    var el=document.getElementById("intro");
    el.classList.add("off");
    setTimeout(function(){ el.style.display="none"; },450);
    started=false; phase="idle";
  };
  document.getElementById("mute").onclick=function(){
    muted=!muted;
    this.textContent=muted?"靜音":"聲音";
    this.style.color=muted?"#5C5749":"#8B8578";
  };

  /* 初始化 */
  resize();
  reset();
  requestAnimationFrame(loop);

  /* 供測試用 */
  window.__game={
    state:function(){ return {phase:phase, dropsLeft:dropsLeft, caught:caught.length,
      score:score, clawX:Math.round(claw.x), clawY:Math.round(claw.y), items:items.filter(function(i){return !i.dead;}).length}; },
    tap:tap,
    forceState:function(excludeX){ // 對準某個 x 再放爪（測試用）
      if(phase!=="idle"||dropsLeft<=0) return false;
      claw.x=excludeX; phase="drop"; dropsLeft--; started=true; return true;
    },
    items:function(){ return items.filter(function(i){return !i.dead;}).map(function(i){return {e:i.e,x:Math.round(i.x),y:Math.round(i.y),w:i.w};}); }
  };
})();
</script>
</body>
</html>
