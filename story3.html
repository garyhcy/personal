<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080B12">
<title>今晚行下</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#080B12;
    font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;
    color:#EDE6D8;user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  #hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:5;
    opacity:0;transition:opacity .8s}
  #hud.on{opacity:1}
  #slots{display:flex;justify-content:center}
  #kept{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden;max-width:86vw}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:20px;
    border:1px solid rgba(243,193,120,.34);background:rgba(12,15,22,.72);
    font-size:10.5px;letter-spacing:.06em;color:rgba(246,240,229,.9);
    animation:chipIn .45s both}
  .chip i{font-style:normal;font-size:11px;opacity:.85}
  @keyframes chipIn{from{opacity:0;transform:translateY(-4px) scale(.94)}to{opacity:1;transform:none}}
  #obj{font-size:11.5px;letter-spacing:.16em;color:rgba(237,230,216,.46);
    padding:5px 14px;border-radius:99px;background:rgba(8,11,18,.55);
    border:1px solid rgba(237,230,216,.10);transition:color .5s,border-color .5s}
  #obj.ready{color:#F3C178;border-color:rgba(243,193,120,.42)}

  #cap{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));
    padding:0 28px;text-align:center;z-index:6;pointer-events:none;
    font-size:16px;line-height:1.85;letter-spacing:.03em;
    color:#EFE7D8;text-shadow:0 2px 16px rgba(0,0,0,.9);
    opacity:0;transform:translateY(6px);transition:opacity .45s,transform .45s}
  #cap.on{opacity:1;transform:none}
  #cap.mono{font-size:14px;color:#C7BDAB}

  /* 引導 */
  #coach{position:fixed;left:50%;bottom:calc(118px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(8px);z-index:7;
    display:flex;align-items:center;gap:9px;
    padding:9px 16px 9px 12px;border-radius:99px;
    background:rgba(10,14,22,.86);border:1px solid rgba(243,193,120,.30);
    font-size:13px;letter-spacing:.06em;color:#F3C178;white-space:nowrap;
    opacity:0;transition:opacity .45s,transform .45s;pointer-events:none;
    box-shadow:0 10px 30px rgba(0,0,0,.6)}
  #coach.on{opacity:1;transform:translateX(-50%)}
  #coach b{font-weight:600}
  #coach i{font-style:normal;font-size:15px;opacity:.9}

  #zonetag{position:fixed;left:18px;top:calc(96px + env(safe-area-inset-top));
    z-index:6;font-size:12px;letter-spacing:.3em;color:rgba(237,230,216,.5);
    opacity:0;transition:opacity .8s;pointer-events:none}
  #zonetag.on{opacity:1}

  #clue{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:9;pointer-events:none;opacity:0;transition:opacity .35s}
  #clue.on{opacity:1}
  #clueBox{width:min(80vw,330px);padding:26px 24px 22px;border-radius:5px;
    background:linear-gradient(160deg,rgba(26,31,42,.98),rgba(12,16,24,.98));
    border:1px solid rgba(243,193,120,.34);
    box-shadow:0 20px 64px rgba(0,0,0,.75),inset 0 0 44px rgba(243,193,120,.05);
    text-align:center;transform:scale(.94);transition:transform .35s}
  #clue.on #clueBox{transform:none}
  #clueKick{font-size:10px;letter-spacing:.34em;color:#F3C178;margin-bottom:14px}
  #clueGlyph{font-size:30px;margin-bottom:12px}
  #clueTxt{font-size:14px;line-height:1.95;color:#DDD4C4}

  #toast{position:fixed;left:50%;top:calc(108px + env(safe-area-inset-top));
    transform:translateX(-50%) translateY(-8px);
    padding:9px 18px;border-radius:99px;background:rgba(12,16,24,.92);
    border:1px solid rgba(243,193,120,.26);font-size:12.5px;letter-spacing:.06em;
    color:#F3C178;z-index:8;opacity:0;transition:opacity .4s,transform .4s;
    pointer-events:none;white-space:nowrap}
  #toast.on{opacity:1;transform:translateX(-50%)}

  #exp{position:fixed;inset:0;z-index:12;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(4,7,12,0);opacity:0;pointer-events:none;transition:opacity .4s,background .4s}
  #exp.on{opacity:1;pointer-events:auto;background:rgba(4,7,12,.46)}
  #expBox{width:min(92vw,420px);margin-bottom:calc(26px + env(safe-area-inset-bottom));
    padding:22px 22px 18px;border-radius:16px;text-align:center;
    background:linear-gradient(170deg,rgba(26,31,42,.98),rgba(11,15,22,.99));
    border:1px solid rgba(243,193,120,.30);
    box-shadow:0 24px 70px rgba(0,0,0,.8);
    transform:translateY(16px);transition:transform .4s}
  #exp.on #expBox{transform:none}
  #expShot{display:block;width:calc(100% + 44px);margin:-22px -22px 16px;height:150px;
    border-radius:16px 16px 0 0;-webkit-mask-image:linear-gradient(#000 62%,transparent);
    mask-image:linear-gradient(#000 62%,transparent)}
  #expKick{font-size:10px;letter-spacing:.34em;color:rgba(243,193,120,.75);margin-bottom:10px}
  #expTitle{font-size:20px;letter-spacing:.10em;color:#F3C178;margin-bottom:12px}
  #expTx{font-size:14.5px;line-height:2.0;color:#DDD4C4;white-space:pre-line;margin-bottom:20px}
  #expActs{display:flex;gap:10px;justify-content:center}
  .btn.sm{margin:0;padding:11px 22px;font-size:13.5px;letter-spacing:.12em}
  .btn.sm.ghost{border-color:rgba(237,230,216,.20);color:rgba(237,230,216,.6);background:transparent}

  #mute{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:10;
    width:34px;height:34px;border-radius:50%;border:1px solid rgba(237,230,216,.16);
    background:rgba(8,11,18,.6);color:rgba(237,230,216,.7);font-size:13px;
    font-family:system-ui;cursor:pointer}
  #mute.off{color:rgba(237,230,216,.26)}

  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:34px;text-align:center;z-index:20;background:#080B12;
    opacity:0;pointer-events:none;transition:opacity .9s}
  .screen.on{opacity:1;pointer-events:auto}
  #intro{background:radial-gradient(circle at 50% 40%,#131A26 0%,#080B12 65%)}
  #intro .kick{font-size:10.5px;letter-spacing:.44em;color:rgba(237,230,216,.48);margin-bottom:26px}
  #intro .lead{font-size:17px;line-height:2.15;letter-spacing:.04em;color:#EDE6D8;
    max-width:310px;white-space:pre-line;min-height:140px;
    display:flex;align-items:center;justify-content:center}
  .btn{margin-top:34px;padding:13px 36px;border-radius:99px;cursor:pointer;
    border:1px solid rgba(243,193,120,.5);background:rgba(243,193,120,.06);
    color:#F3C178;font-family:inherit;font-size:14px;letter-spacing:.18em;
    transition:background .3s,transform .2s}
  .btn:active{transform:scale(.97);background:rgba(243,193,120,.15)}

  #end{background:radial-gradient(circle at 50% 40%,#1A2130 0%,#080B12 64%)}
  #room{width:100%;max-width:430px;display:flex;flex-direction:column;align-items:center}
  #frames{display:flex;gap:11px;margin-bottom:28px}
  .frame{width:74px;height:94px;border:1px solid rgba(243,193,120,.30);padding:3px;
    opacity:0;transform:translateY(8px) scale(.96);transition:opacity .8s,transform .8s;
    box-shadow:0 8px 26px rgba(0,0,0,.65)}
  .frame.on{opacity:1;transform:none}
  .frame i{display:block;width:100%;height:100%}
  .frame b{display:block;font-weight:400;font-size:9.5px;letter-spacing:.12em;
    color:rgba(237,230,216,.5);text-align:center;margin-top:6px}
  .frame.sel b{color:#F3C178}
  #frames{align-items:flex-start}
  .frame{transition:opacity .8s,transform .8s,box-shadow .5s}
  #end.choosing .frame{pointer-events:auto;cursor:pointer}
  #end.choosing .frame:hover{box-shadow:0 0 0 1px rgba(243,193,120,.7),0 8px 26px rgba(0,0,0,.65)}
  .frame.sel{transform:scale(1.16);box-shadow:0 0 0 1px rgba(243,193,120,.9),0 14px 40px rgba(0,0,0,.7),0 0 30px rgba(243,193,120,.22)}
  .frame.dim{opacity:.22}
  .frame.fog{opacity:.30;pointer-events:none}
  .frame.fog i{filter:blur(3px) saturate(.4) brightness(.7)}
  .frame.fog b{color:rgba(237,230,216,.3)}
  .f-a i{background:url(assets/photo-a.jpg) center/cover no-repeat}
  .f-b i{background:url(assets/photo-b.jpg) center/cover no-repeat}
  .f-c i{background:url(assets/photo-c.jpg) center/cover no-repeat}
  .f-d i{background:url(assets/photo-d.jpg) center/cover no-repeat}
  .paper{max-width:330px;opacity:0;transition:opacity .9s}
  .paper.on{opacity:1}
  .paper p{margin:0 0 14px;font-size:14px;line-height:2;color:#B4A996}
  .paper .hand{font-size:15.5px;line-height:2.05;color:#E4D9C4;
    letter-spacing:.02em;white-space:pre-line}
  .kick2{font-size:10px;letter-spacing:.34em;color:rgba(237,230,216,.45);margin-bottom:22px;text-align:center}
  #endKept{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:340px;margin:0 auto 18px}
  #endKept .chip{animation:chipIn .5s both}
  #endKept .chip s{text-decoration:none;font-size:9.5px;color:rgba(243,193,120,.8);letter-spacing:.06em}
  #endCalc{font-size:11px;letter-spacing:.14em;color:rgba(237,230,216,.42);margin-bottom:20px;text-align:center;white-space:pre-line;line-height:1.9;
    opacity:0;transition:opacity .6s}
  #endCalc.on{opacity:1}
  #endLead{font-size:13px;line-height:1.95;color:rgba(221,212,196,.62);letter-spacing:.06em;
    max-width:300px;margin:0 auto;text-align:center;white-space:pre-line;opacity:0;transition:opacity .7s}
  #endLead.on{opacity:1}
  #endTail{font-size:11.5px;line-height:1.9;color:rgba(237,230,216,.44);letter-spacing:.10em;
    margin-top:16px;text-align:center;opacity:0;transition:opacity .7s}
  #endTail.on{opacity:1}
  #endCity{font-size:36px;letter-spacing:.32em;margin:14px 0 2px;opacity:0;
    transition:opacity 1s,letter-spacing 1.4s;color:#F3C178}
  #endCity.on{opacity:1;letter-spacing:.16em}
  #endLine{margin-top:22px;font-size:16px;line-height:2.05;letter-spacing:.05em;
    white-space:pre-line;opacity:0;transition:opacity 1s}
  #endLine.on{opacity:1}
  #endSmall{margin-top:20px;font-size:11.5px;letter-spacing:.2em;color:rgba(237,230,216,.32);
    opacity:0;transition:opacity .8s}
  #endSmall.on{opacity:1}
  #again{margin-top:24px;opacity:0;transition:opacity .8s;pointer-events:none}
  #again.on{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="slots"><div id="kept"></div></div>
  <div id="obj">停 低 ， 睇 吓 你 鍾 意 邊 樣</div>
</div>

<div id="zonetag"></div>
<div id="coach"><i>☝</i><span id="coachTx">點 地 下 ， 行 過 去</span></div>
<div id="cap"></div>
<div id="toast"></div>
<div id="clue"><div id="clueBox">
  <div id="clueKick">搵 到 一 樣</div>
  <div id="clueGlyph">✉</div>
  <div id="clueTxt"></div>
</div></div>
<div id="exp"><div id="expBox">
  <canvas id="expShot" width="640" height="300"></canvas>
  <div id="expKick">呢 度</div>
  <div id="expTitle"></div>
  <div id="expTx"></div>
  <div id="expActs">
    <button class="btn sm" id="expKeep">記 住 呢 度</button>
    <button class="btn sm ghost" id="expSkip">算 數</button>
  </div>
</div></div>
<button id="mute">♪</button>

<div id="intro" class="screen on">
  <div class="kick" id="ikick">一 把 鎖 匙</div>
  <div class="lead" id="ilead">你喺門口企咗一陣。</div>
  <button class="btn" id="go">開門</button>
</div>

<div id="end" class="screen">
  <div id="room">
    <div class="kick2" id="endKick">你 今 晚 停 低 咗 0 次</div>
    <div id="endKept"></div>
    <div id="endCalc"></div>
    <div id="endLead"></div>
    <div id="endCity"></div>
    <div id="endLine"></div>
    <div id="endTail"></div>
    <button class="btn" id="again">再 行 一 次</button>
  </div>
</div>

<script>
/* ============ 基礎 ============ */
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var VW=0,VH=0,DPR=1;
var W=1536,H=1024;
var IMG={}, loaded=0;

function loadImg(k,src){ var im=new Image(); im.onload=function(){ loaded++; }; im.src=src; IMG[k]=im; }
loadImg('map','assets/map.jpg');
loadImg('girl','assets/girl-walk.png');
loadImg('scene-a','assets/scene-a.jpg');
loadImg('scene-b','assets/scene-b.jpg');
loadImg('scene-c','assets/scene-c.jpg');
loadImg('scene-d','assets/scene-d.jpg');

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function hexA(h,a){ var n=parseInt(h.slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }

/* ============ 世界 ============ */
var ZONES={
  a:{n:'舊街',x:300,y:300,c:'#C4573C',fr:'窗對住河，冬天成條街都係火鍋味。'},
  b:{n:'山上',x:1175,y:262,c:'#6B9E86',fr:'嗰間澡堂，係唯一可以成晚唔講嘢都舒服嘅地方。'},
  c:{n:'河邊',x:330,y:612,c:'#5B84B8',fr:'唔係為咗睇燈籠，係為咗等燈籠一盞一盞著。'},
  d:{n:'夜市',x:1150,y:780,c:'#C0556C',fr:'最後一晚，佢買咗串糖，一路行一路拎住，最後冇食。'}
};
var HOUSE={x:775,y:520};
var WATER={x0:0,x1:560,y0:648};

var SPOTS=[
  {zone:'a',x:255,y:300,art:'lantern',label:'紅燈籠',city:'sh',
   line:'燈籠紅得好舊，紅到似退咗色。\n雨打落上面，燈影一格一格咁搖。'},
  {zone:'a',x:415,y:352,art:'bowl',label:'熱湯麵',city:'tw',
   line:'布簾下面漏出熱氣，湯滾緊。\n我企喺簷下，聞到蔥同豬油。'},
  {zone:'a',x:330,y:432,art:'photo',label:'雨打簷篷',city:'sh',
   line:'雨打鐵皮，响得好實。\n有人喺裡面熄咗燈，隔一陣又開返。'},

  {zone:'b',x:1216,y:196,art:'bath',label:'蒸氣',city:'jp',
   line:'行到呢度，耳朵突然靜咗。\n蒸氣由門縫鑽出嚟，暖嘅。'},
  {zone:'b',x:1146,y:330,art:'lantern',label:'石階',city:'bj',
   line:'石階一級一級，燈隔幾級先有一盞。\n我行到一半，停低聽水聲。'},
  {zone:'b',x:1182,y:428,art:'photo',label:'松樹',city:'jp',
   line:'松樹好高，風一過，成片山都响。\n空氣有陣樹脂味，凍嘅。'},

  {zone:'c',x:300,y:596,art:'lantern',label:'浮燈',city:'jp',
   line:'水面有燈，一路飄，飄到睇唔到。\n對岸有人放緊，冇樣。'},
  {zone:'c',x:452,y:632,art:'boat',label:'小船',city:'sh',
   line:'隻船纜喺岸邊，纜繩鬆鬆地。\n我想坐一陣，唔講嘢。'},
  {zone:'c',x:188,y:606,art:'photo',label:'河水',city:'bj',
   line:'河水拍石堤，一下一下，唔急。\n伸手去掂，凍到縮手。'},

  {zone:'d',x:930,y:642,art:'stall',label:'檔口',city:'bj',
   line:'鑊氣撐起半條街。\n有人叫賣，有人同隔籬檔嗌交，然後一齊笑。'},
  {zone:'d',x:1082,y:722,art:'sugar',label:'糖',city:'tw',
   line:'買咗一枝糖，唔捨得食。\n拎住行咗半條街，仲暖。'},
  {zone:'d',x:1220,y:858,art:'photo',label:'人聲',city:'tw',
   line:'全部都講得好快，我聽唔明。\n但佢哋笑嘅位，我大概明。'}
];
SPOTS.forEach(function(s,i){ s.i=i; });

var GLYPH={lantern:'●',bowl:'◡',bath:'≋',boat:'⌣',stall:'▤',sugar:'◍',photo:'▣'};
var SCENE={a:'assets/scene-a.jpg',b:'assets/scene-b.jpg',c:'assets/scene-c.jpg',d:'assets/scene-d.jpg'};
var PHOTO={a:'assets/photo-a.jpg',b:'assets/photo-b.jpg',c:'assets/photo-c.jpg',d:'assets/photo-d.jpg'};
var PHOTO_T={
  a:'雨夜，紅燈籠，一條好窄嘅街。',
  b:'山上面嘅澡堂，門口一直有蒸氣。',
  c:'河邊，燈浮喺水面，一路飄。',
  d:'夜市，帆布下面一盞一盞燈。'
};

/* ============ 狀態 ============ */
var state, started=false, pending=-1, t=0, last=0, soundOn=true;
var cam={x:HOUSE.x,y:HOUSE.y+70,scale:0.9};
var order=[], coachStep=0, movedOnce=false;
var flies=[];

function newState(){
  return {p:{x:HOUSE.x,y:HOUSE.y+66},face:1,moving:false,tgt:null,
    done:{},seenZone:{},kept:[],zones:[],stopped:0,counts:{sh:0,tw:0,jp:0,bj:0},
    ended:false,walk:0,paused:false};
}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  VW=cv.clientWidth||window.innerWidth;
  VH=cv.clientHeight||window.innerHeight;
  cv.width=Math.floor(VW*DPR); cv.height=Math.floor(VH*DPR);
  var base=Math.max(VW/W, VH/H);
  cam.scale=clamp(base*(VW<520?1.14:1.0),0.6,1.35);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,120); });

function s2w(sx,sy){ return {x:(sx-VW/2)/cam.scale+cam.x, y:(sy-VH/2)/cam.scale+cam.y}; }
function w2s(wx,wy){ return {x:(wx-cam.x)*cam.scale+VW/2, y:(wy-cam.y)*cam.scale+VH/2}; }

function initFlies(){
  var r=mulberry32(9); flies=[];
  for(var i=0;i<40;i++) flies.push({x:r()*W,y:r()*H,ph:r()*6.28,sp:0.25+r()*0.5,s:0.7+r()*1.1});
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t2=Math.imul(a^a>>>15,1|a);t2=t2+Math.imul(t2^t2>>>7,61|t2)^t2;return((t2^t2>>>14)>>>0)/4294967296;};}

/* ============ 畫物件 ============ */
function glyph(art,z,pin){
  var warm='#F3C178';
  ctx.lineWidth=1.5;
  if(art==='lantern'){
    ctx.strokeStyle='rgba(20,14,12,.55)'; ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(0,-15); ctx.stroke();
    ctx.fillStyle=z.c; ctx.beginPath(); ctx.ellipse(0,-6,8,9.6,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,232,200,.6)'; ctx.beginPath(); ctx.ellipse(-2.4,-8.6,2.4,3.6,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#3A241E'; ctx.fillRect(-3.2,-16,6.4,2.2); ctx.fillRect(-3.2,2.6,6.4,2.2);
  }else if(art==='bowl'){
    ctx.fillStyle=pin?'#8A93A8':'#4A5364'; ctx.beginPath(); ctx.moveTo(-10,-2); ctx.quadraticCurveTo(0,12,10,-2); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(243,193,120,.55)'; ctx.beginPath(); ctx.ellipse(0,-2.2,10,3,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.beginPath(); ctx.moveTo(-2.6,-9); ctx.quadraticCurveTo(0,-16,2.6,-9); ctx.stroke();
  }else if(art==='bath'){
    ctx.fillStyle=pin?'#4E5A54':'#1C2622'; ctx.fillRect(-12,-11,24,18);
    ctx.fillStyle=z.c; ctx.fillRect(-12,-15,24,4.6);

function glow(g,x,y,r,col){
  var gr=g.createRadialGradient(x,y,0,x,y,r);
  gr.addColorStop(0,col); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
}
function softShadow(g,x,y,rx,ry,a){
  g.save(); g.translate(x,y); g.scale(1,ry/rx);
  var gr=g.createRadialGradient(0,0,0,0,0,rx);
  gr.addColorStop(0,'rgba(0,0,0,'+a+')');
  gr.addColorStop(0.6,'rgba(0,0,0,'+(a*0.45)+')');
  gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(0,0,rx,0,Math.PI*2); g.fill(); g.restore();
}

function grade(){

  var g2=ctx.createRadialGradient(VW/2,VH*0.46,VH*0.20,VW/2,VH*0.46,Math.max(VW,VH)*0.78);

}
function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath();
}

function drawSpots(){
  for(var i=0;i<SPOTS.length;i++){
    var s=SPOTS[i];
    var p=w2s(s.x,s.y);
    if(p.x<-160||p.x>VW+160||p.y<-200||p.y>VH+200) continue;
    var z=ZONES[s.zone], done=!!state.done[s.i];
    var pulse=0.70+0.30*Math.sin(t*2.0+i*0.7);
    var sc=cam.scale;

    if(!done){
      var d2=Math.hypot(state.p.x-s.x,state.p.y-s.y);
      var near=clamp(1-(d2-90)/260,0,1);
      var R=22+near*2;
      // 光
      glow(ctx,p.x,p.y,66*pulse,hexA(z.c,0.15));
      glow(ctx,p.x,p.y,30*pulse,hexA(z.c,0.13));
      // 地面光池＋柱
      var pool=ctx.createRadialGradient(p.x,p.y+22,0,p.x,p.y+22,24);
      pool.addColorStop(0,'rgba(243,193,120,.22)');
      pool.addColorStop(1,'rgba(243,193,120,0)');
      ctx.fillStyle=pool;
      ctx.beginPath(); ctx.ellipse(p.x,p.y+22,24,8,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle=hexA(z.c,0.30); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(p.x,p.y+R-2); ctx.lineTo(p.x,p.y+18); ctx.stroke();

      // 牌：暖炭漸變
      var dg=ctx.createLinearGradient(p.x,p.y-R,p.x,p.y+R);
      dg.addColorStop(0,'rgba(58,54,58,.96)');
      dg.addColorStop(0.55,'rgba(28,29,36,.96)');
      dg.addColorStop(1,'rgba(10,12,18,.96)');
      ctx.fillStyle=dg;
      ctx.beginPath(); ctx.arc(p.x,p.y,R,0,Math.PI*2); ctx.fill();

      // 內高光弧
      ctx.strokeStyle='rgba(255,240,215,.18)'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(p.x,p.y,R-1.6,Math.PI*1.08,Math.PI*1.92); ctx.stroke();

      // 地區色外環
      ctx.strokeStyle=hexA(z.c,0.80+near*0.15); ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(p.x,p.y,R,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle=hexA(z.c,0.22); ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(p.x,p.y,R+2.6,0,Math.PI*2); ctx.stroke();

      // 圖示
      ctx.save();
      ctx.translate(p.x,p.y+2); ctx.scale(sc*0.92,sc*0.92);
      ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=4; ctx.shadowOffsetY=1;
      glyph(s.art,z,true);
      ctx.restore();

      // 名
      ctx.font='11.5px system-ui,-apple-system,"PingFang HK",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      var tw=ctx.measureText(s.label).width;
      var pw=tw+18, ph=18, py=p.y+36;
      ctx.fillStyle='rgba(8,11,18,.70)';
      roundRect(ctx,p.x-pw/2,py,pw,ph,9); ctx.fill();
      ctx.strokeStyle=hexA(z.c,0.30); ctx.lineWidth=1;
      roundRect(ctx,p.x-pw/2,py,pw,ph,9); ctx.stroke();
      ctx.fillStyle='rgba(246,240,229,.95)';
      ctx.fillText(s.label,p.x,py+ph/2+0.5);
      ctx.textBaseline='alphabetic';
    }else{
      glow(ctx,p.x,p.y,20,hexA(z.c,0.12));
      ctx.strokeStyle=hexA(z.c,0.42); ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(p.x,p.y,8.5,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle=hexA(z.c,0.16);
      ctx.beginPath(); ctx.arc(p.x,p.y,8.5,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(246,240,229,.72)'; ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.moveTo(p.x-3,p.y+0.4); ctx.lineTo(p.x-0.8,p.y+2.6); ctx.lineTo(p.x+3.4,p.y-2.4); ctx.stroke();
      ctx.font='10px system-ui,-apple-system,"PingFang HK",sans-serif';
      ctx.textAlign='center';
      ctx.fillStyle='rgba(237,230,216,.34)';
      ctx.fillText(s.label,p.x,p.y+22);
    }
  }
}

function drawWaypoints(){
  var list=[];
  for(var i=0;i<SPOTS.length;i++){
    var s=SPOTS[i];
    if(s.clue===undefined||state.done[s.i]) continue;
    list.push({x:s.x,y:s.y,c:ZONES[s.zone].c,g:'✉'});
  }
  if(keptCount()>=3&&!state.ended){ list=[{x:HOUSE.x,y:HOUSE.y,c:'#F3C178',g:'⌂'}]; }
  if(!list.length) return;
  list.sort(function(a,b){
    return Math.hypot(a.x-state.p.x,a.y-state.p.y)-Math.hypot(b.x-state.p.x,b.y-state.p.y);
  });
  var take=list.slice(0,2);
  for(var k=0;k<take.length;k++){
    var it=take[k], p=w2s(it.x,it.y);
    var onScreen=p.x>26&&p.x<VW-26&&p.y>26&&p.y<VH-26;
    if(onScreen){
      // 屏幕內：頭上小三角
      var dy=34+Math.sin(t*2.4)*3;
      ctx.fillStyle=hexA(it.c,0.75);
      ctx.beginPath();
      ctx.moveTo(p.x,p.y-dy+7); ctx.lineTo(p.x-6,p.y-dy-2); ctx.lineTo(p.x+6,p.y-dy-2);
      ctx.closePath(); ctx.fill();
      continue;
    }
    var cx=VW/2, cy=VH/2;
    var ang=Math.atan2(p.y-cy,p.x-cx);
    var pad=46;
    var rx=(VW/2-pad), ry=(VH/2-pad);
    var ex=cx+Math.cos(ang)*rx*0.92, ey=cy+Math.sin(ang)*ry*0.92;
    ex=clamp(ex,pad,VW-pad); ey=clamp(ey,pad,VH-pad);
    ctx.save(); ctx.translate(ex,ey); ctx.rotate(ang);
    ctx.fillStyle=hexA(it.c,0.85);
    ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(-6,-7); ctx.lineTo(-6,7); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.font='12px system-ui,-apple-system,sans-serif';
    ctx.textAlign='center'; ctx.fillStyle=hexA(it.c,0.75);
    ctx.fillText(it.g,ex,ey+22);
  }
}

var AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function blip(freq,vol){
  if(!soundOn) return;
  var a=ac(); if(!a) return;
  var o=a.createOscillator(), g=a.createGain();
  o.type='sine'; o.frequency.value=freq;
  g.gain.value=0; g.gain.linearRampToValueAtTime(vol,a.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+0.7);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.72);
}

function keptCount(){ return state.kept.length; }

function clampTgt(x,y){
  x=clamp(x,40,W-40); y=clamp(y,40,H-40);
  if(x<WATER.x1 && y>WATER.y0) y=WATER.y0-8;
  return {x:x,y:y};
}
function walkTo(x,y){
  var p=clampTgt(x,y);
  state.tgt={x:p.x,y:p.y};
}
function handleTap(sx,sy){
  if(!started||state.ended||state.paused) return;
  var w=s2w(sx,sy);
  if(Math.hypot(w.x-HOUSE.x,w.y-HOUSE.y)<140){
    pending=-2; walkTo(HOUSE.x,HOUSE.y+56); return;
  }
  var best=-1,bd=1e9;
  for(var i=0;i<SPOTS.length;i++){
    var s=SPOTS[i];
    if(state.done[s.i]) continue;
    var d=Math.hypot(w.x-s.x,w.y-s.y);
    if(d<bd){ bd=d; best=i; }
  }
  if(best>=0&&bd<105){
    var s2=SPOTS[best];
    var ang=Math.atan2(state.p.y-s2.y,state.p.x-s2.x);
    pending=best;
    walkTo(s2.x+Math.cos(ang)*44, s2.y+Math.sin(ang)*44);
    return;
  }
  pending=-1;
  walkTo(w.x,w.y);
}

var curSpot=-1;
var shotCv=null, shotCtx=null, shotSpot=null;
function paintExpShot(s){
  shotSpot=s;
  if(!shotCv){ shotCv=document.getElementById('expShot'); shotCtx=shotCv.getContext('2d'); }
  var g=shotCtx, CW=shotCv.width, CH=shotCv.height;
  g.clearRect(0,0,CW,CH);
  var sc=IMG['scene-'+s.zone];
  if(sc && !(sc.complete&&sc.naturalWidth)){
    if(!sc.__hooked){ sc.__hooked=true;
      sc.addEventListener('load',function(){ if(shotSpot) paintExpShot(shotSpot); });
    }
  }
  if(sc&&sc.complete&&sc.naturalWidth){
    var iw=sc.naturalWidth, ih=sc.naturalHeight;
    var tr=CW/CH, sr=iw/ih, cw,ch,cx,cy;
    if(sr>tr){ ch=ih; cw=ih*tr; cx=(iw-cw)/2; cy=0; }
    else { cw=iw; ch=iw/tr; cx=0; cy=(ih-ch)/2; }
    g.drawImage(sc,cx,cy,cw,ch,0,0,CW,CH);
  }else if(IMG.map&&IMG.map.complete&&IMG.map.naturalWidth){
    var sw=300, sh=sw*CH/CW;
    var sx=clamp(s.x-sw/2, 0, W-sw), sy=clamp(s.y-sh/2-20, 0, H-sh);
    g.drawImage(IMG.map, sx,sy,sw,sh, 0,0,CW,CH);
  }
  // 壓暗邊
  var vg=g.createRadialGradient(CW/2,CH*0.52,CH*0.2,CW/2,CH*0.52,CW*0.62);
  vg.addColorStop(0,'rgba(6,9,14,0)'); vg.addColorStop(1,'rgba(6,9,14,.62)');
  g.fillStyle=vg; g.fillRect(0,0,CW,CH);
  // 暖光點
  var lg=g.createRadialGradient(CW/2,CH*0.62,4,CW/2,CH*0.62,CW*0.30);
  lg.addColorStop(0,'rgba(243,193,120,.42)'); lg.addColorStop(1,'rgba(243,193,120,0)');
  g.fillStyle=lg; g.fillRect(0,0,CW,CH);
}

function collect(i){
  var s=SPOTS[i];
  if(!s||state.done[s.i]) return;
  curSpot=i;
  el.expTitle.textContent=s.label;
  el.expTx.textContent=s.line+ (s.clue?'\n（呢一格，係其中一張相嘅一部分。）':'');
  el.expKick.textContent=ZONES[s.zone].n;
  paintExpShot(s);
  el.exp.classList.add('on');
  state.paused=true;
  blip(392,.04);
}
function closeExp(){
  el.exp.classList.remove('on');
  state.paused=false;
  curSpot=-1;
}
function keepSpot(){
  var i=curSpot; if(i<0){ closeExp(); return; }
  var s=SPOTS[i];
  if(state.done[s.i]){ closeExp(); return; }
  state.done[s.i]=true;
  state.stopped++;
  state.kept.push(s.i);
  state.counts[s.city]=(state.counts[s.city]||0)+1;
  if(state.order.indexOf(s.city)<0) state.order.push(s.city);
  updateKept();
  blip(660,.06);
  if(navigator.vibrate) navigator.vibrate(16);
  closeExp();
  say('記住咗。');
  if(state.kept.length===1){
    setTimeout(function(){ coach('再 行 多 幾 處'); },900);
    setTimeout(function(){ coach(null); },4200);
  }
  if(state.kept.length===3&&!state.hintDone){
    state.hintDone=true;
    setTimeout(function(){ coach('你 開 始 知 自 己 鍾 意 咩'); },900);
    setTimeout(function(){ coach(null); },4200);
  }
  if(state.kept.length>=6&&!state.walkHint){
    state.walkHint=true;
    setTimeout(function(){ coach('⌂ 行 夠 就 返 屋 企'); },900);
    setTimeout(function(){ coach(null); },5200);
  }
}

function clampCam(){
  var hw=VW/(2*cam.scale), hh=VH/(2*cam.scale);
  if(W<=hw*2) cam.x=W/2; else cam.x=clamp(cam.x,hw,W-hw);
  if(H<=hh*2) cam.y=H/2; else cam.y=clamp(cam.y,hh,H-hh);
}

function update(dt){
  if(state.tgt){
    var dx=state.tgt.x-state.p.x, dy=state.tgt.y-state.p.y;
    var d=Math.hypot(dx,dy);
    if(d>2.0){
      var sp=196*(dt);
      var step=Math.min(sp,d);
      state.p.x+=dx/d*step; state.p.y+=dy/d*step;
      state.walk+=step;
      state.moving=true;
      if(Math.abs(dx)>2) state.face=dx>0?1:-1;
    }else{
      state.p.x=state.tgt.x; state.p.y=state.tgt.y;
      state.tgt=null; state.moving=false;
      if(pending>=0){ var pi=pending; pending=-1; collect(pi); }
      else if(pending===-2){ pending=-1; finish(); }
    }
  }else{
    state.moving=false;
  }
  // 唔好行落水
  if(state.p.x<WATER.x1&&state.p.y>WATER.y0-6) state.p.y=WATER.y0-6;

  // 首次移動提示
  if(!movedOnce&&state.stopped===0&&state.moving){ }
  if(!movedOnce&&state.walk>60){ movedOnce=true; if(coachStep===0){ coachStep=1; coach('☝ 點發光嘅地方，行過去'); } }

  // 區名
  for(var k in ZONES){
    var z=ZONES[k];
    if(Math.hypot(state.p.x-z.x,state.p.y-z.y)<250){
      if(state.zoneNow!==k){
        state.zoneNow=k;
        var first=state.zones.indexOf(k)<0;
        if(first) state.zones.push(k);
        if(first&&state.zones.length===4&&!state.allZones){
          state.allZones=true;
          setTimeout(function(){ toast('四張相，都行過了。'); },1200);
          setTimeout(function(){ coach('⌂ 行 返 屋 企'); },2600);
          setTimeout(function(){ coach(null); },8200);
        }
        var ord=state.zones.indexOf(k)+1;
        zoneTag(z.n+(ord<=4?' · 第 '+ord+' 張相':''));
        if(!state.fragShown||!state.fragShown[k]){ state.fragShown=state.fragShown||{}; state.fragShown[k]=true; setTimeout(function(){ say(z.fr,4200); },1200); }
      }
      break;
    }
  }

  cam.x+=(state.p.x-cam.x)*Math.min(1,dt*4.0);
  cam.y+=(state.p.y-cam.y)*Math.min(1,dt*4.0);
  clampCam();
}

function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#080B12'; ctx.fillRect(0,0,VW,VH);

  ctx.save();
  ctx.translate(VW/2,VH/2); ctx.scale(cam.scale,cam.scale); ctx.translate(-cam.x,-cam.y);
  if(IMG.map&&IMG.map.complete&&IMG.map.naturalWidth){ ctx.drawImage(IMG.map,0,0,W,H); }
  else { ctx.fillStyle='#111823'; ctx.fillRect(0,0,W,H); }
  // 開光
  buildBloom();
  if(bloomReady){
    ctx.globalCompositeOperation='screen';
    ctx.globalAlpha=0.42;
    ctx.drawImage(bloomCv,0,0,W,H);
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
  }
  // 慢霧
  ctx.globalCompositeOperation='screen';
  for(var f=0;f<3;f++){
    var fx=(W*0.5)+Math.sin(t*0.045+f*2.1)*W*0.30;
    var fy=(H*0.5)+Math.cos(t*0.037+f*1.7)*H*0.26;
    var fr=W*0.34;
    var fg=ctx.createRadialGradient(fx,fy,0,fx,fy,fr);
    fg.addColorStop(0,'rgba(120,140,180,0.030)');
    fg.addColorStop(1,'rgba(120,140,180,0)');
    ctx.fillStyle=fg; ctx.beginPath(); ctx.arc(fx,fy,fr,0,Math.PI*2); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  ctx.restore();

  ctx.save();
  ctx.translate(VW/2,VH/2); ctx.scale(cam.scale,cam.scale); ctx.translate(-cam.x,-cam.y);
  // 世界層（用世界座標畫 glow 需要 scale 還原；簡單起見全部用螢幕座標畫）
  ctx.restore();

  drawSpots();
  drawHouse();
  drawTarget();
  drawPlayer();
  drawFlies(dt);
  grade();
  drawWaypoints();
}

function frame(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0.016); last=ts;
  t+=dt;
  try{ if(started&&!state.ended&&!state.paused) update(dt); }catch(e){ if(window.__err) window.__err.push('update:'+e.message); }
  try{ render(dt); }catch(e){ if(window.__err) window.__err.push('render:'+e.message); }
  requestAnimationFrame(frame);
}
/* ============ 結局 ============ */
var CITIES={
  sh:{n:'上海',line:'我哋 12 月，去上海。\n三晚，我帶你行。'},
  tw:{n:'台灣',line:'我哋 12 月，去台灣。\n三晚，我帶你行。'},
  jp:{n:'日本',line:'我哋 12 月，去日本。\n三晚，我帶你行。'},
  bj:{n:'北京',line:'我哋 12 月，去北京。\n三晚，我帶你行。'}
};
function winner(){
  var keys=['sh','tw','jp','bj'], best=null, bv=-1;
  keys.forEach(function(k){
    var v=state.counts[k]||0;
    if(v>bv){ bv=v; best=k; }
    else if(v===bv&&v>0){
      var ai=state.order.indexOf(k), bi=state.order.indexOf(best);
      if(ai>=0&&(bi<0||ai<bi)) best=k;
    }
  });
  return best||'sh';
}

function resetEnd(){
  el.end.classList.remove('on');
  el.endCity.textContent=''; el.endCity.classList.remove('on');
  el.endLine.textContent=''; el.endLine.classList.remove('on');
  el.endCalc.textContent=''; el.endCalc.classList.remove('on');
  el.endLead.textContent=''; el.endLead.classList.remove('on');
  el.endTail.textContent=''; el.endTail.classList.remove('on');
  el.endKept.innerHTML='';
  el.again.classList.remove('on');
}

function finish(){
  if(state.ended) return;
  state.ended=true; state.moving=false; state.tgt=null; pending=-1;
  coach(null);
  el.hud.classList.remove('on');
  resetEnd();
  el.end.classList.add('on');
  el.endKick.textContent='你返到屋企。桌上多咗一張紙。';

  // 逐件列出她揀嘅嘢
  el.endKept.innerHTML=state.kept.map(function(i,idx){
    var sp=SPOTS[i];
    return '<span class="chip" style="animation-delay:'+(idx*0.14)+'s">'+
      '<i>'+GLYPH[sp.art]+'</i>'+sp.label+'<s>'+CITIES[sp.city].n+'</s></span>';
  }).join('');

  if(!state.kept.length){
    el.endCalc.textContent='紙上面，一個名都冇寫。';
    el.endCalc.classList.add('on');
    el.endCity.textContent='下次再行過';
    setTimeout(function(){ el.endCity.classList.add('on'); },600);
    setTimeout(function(){ el.again.classList.add('on'); },1400);
    return;
  }

  var k=winner(), city=CITIES[k];
  var tally=['sh','tw','jp','bj'].filter(function(x){ return (state.counts[x]||0)>0; })
    .sort(function(a,b){ return (state.counts[b]||0)-(state.counts[a]||0); })
    .map(function(x){ return CITIES[x].n+' '+state.counts[x]; }).join('  ·  ');

  var top=Math.max(state.counts.sh||0,state.counts.tw||0,state.counts.jp||0,state.counts.bj||0);
  var ties=['sh','tw','jp','bj'].filter(function(x){ return (state.counts[x]||0)===top; });
  var tieNote=(ties.length>1 && top>0)
    ? tally+'\n\n幾邊一樣多，就以你最先停低嗰樣為準。' : tally;
  setTimeout(function(){ el.endCalc.textContent=tieNote; el.endCalc.classList.add('on'); },800);
  setTimeout(function(){ el.endLead.textContent='你今晚停低嘅，我一樣一樣都停過。'; el.endLead.classList.add('on'); },1700);
  setTimeout(function(){ el.endCity.textContent=city.n; el.endCity.classList.add('on'); blip(523,.07); },2500);
  setTimeout(function(){ el.endLine.textContent=city.line; el.endLine.classList.add('on'); },3300);
  setTimeout(function(){ el.endTail.textContent='（張紙我寫咗好耐。你揀邊樣，都係答案。）'; el.endTail.classList.add('on'); },4200);
  setTimeout(function(){ el.again.classList.add('on'); },5000);
}

/* ============ 開場 ============ */
var INTRO=[
  {k:'一 把 鎖 匙',t:'你喺門口企咗一陣。\n鎖匙係佢寄嚟嘅。信封上冇寫名，\n只有一條街名。',b:'開門'},
  {k:'冇 人 喺 屋 企',t:'屋入面好空，空到聽到自己呼吸。\n窗邊有四張相。',b:'埋去睇'},
  {k:'四 張 相',t:'四張都褪色，褪到剩返一片光。\n相背有字，字都化開咗。',b:'摸一下'},
  {k:'相 入 面 有 路',t:'你用手指掃過第一張。\n腳下嘅石屎路，慢慢浮出嚟。',b:'行入去'}
];
var istep=0, intro=document.getElementById('intro');
var ikick=document.getElementById('ikick'), ilead=document.getElementById('ilead'), go=document.getElementById('go');
function paintIntro(){
  var s=INTRO[istep];
  ikick.textContent=s.k; ilead.textContent=s.t; go.textContent=s.b;
}
go.onclick=function(){
  blip(330,.04);
  if(istep<INTRO.length-1){ istep++; paintIntro(); return; }
  intro.classList.remove('on');
  started=true;
  el.hud.classList.add('on');
  coachStep=0; coach('☝ 點 地 下 ， 行 過 去');
  setTimeout(function(){ say('第一張相。雨聲先到。'); },700);
};

el.again.onclick=function(){ boot(); };

/* ============ 啟動 ============ */
function boot(){
  state=newState();
  state.order=[]; state.fragShown={};
  order=[]; pending=-1; coachStep=0; movedOnce=false;
  cam={x:HOUSE.x,y:HOUSE.y+70,scale:cam.scale};
  el.end.classList.remove('on');
  el.clue.classList.remove('on');
  el.cap.classList.remove('on');
  el.toast.classList.remove('on');
  el.coach.classList.remove('on');
  updateKept();
  istep=0; paintIntro();
  intro.classList.add('on');
  started=false;
  el.hud.classList.remove('on');
}

resize(); initFlies(); boot();
requestAnimationFrame(function(ts){ last=ts; requestAnimationFrame(frame); });

cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  handleTap(e.clientX,e.clientY);
},{passive:false});

/* 測試 hook */
window.__g={
  state:function(){ return state; },
  spots:function(){ return SPOTS; },
  kept:function(){ return state.kept.map(function(i){ return SPOTS[i].label+'·'+CITIES[SPOTS[i].city].n; }); },
  teleport:function(x,y){ state.p.x=x; state.p.y=y; cam.x=x; cam.y=y; },
  tap:function(p){ handleTap(p.x,p.y); },
  walkTo:walkTo, finish:finish, boot:boot,
  cam:function(){ return cam; }, house:function(){ return HOUSE; },
  map:function(){ var m={}; SPOTS.forEach(function(s){ m[s.i]=s.zone+'→'+s.label; }); return m; }
};
